name: Python Data Pipeline CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Libraries
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests

      - name: Run Python Data Script
        run: python3 clean.py

      - name: Commit and Push Cleaned Dataset to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add dataset.csv live_dataset.csv
          git diff --staged --quiet || git commit -m "Automated ETL: Updated 5,000+ cleaned records [skip ci]"
          git push
